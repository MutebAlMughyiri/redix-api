name: CI

on: [push, pull_request]

jobs:
  go-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@v7
      - name: No typo, in code, docs or words (redix-api #125); the words right as written are in _typos.toml
        uses: crate-ci/typos@v1.51.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum
      - name: Typst, which writes the report PDFs
        run: |
          curl -sSfL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "REDIX_Typst__Path=$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" >> "$GITHUB_ENV"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: staticcheck, which reports deprecated calls, unused code and simpler forms (redix-api #125)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: make cover
