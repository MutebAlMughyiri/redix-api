# Dependabot (Muteb, 13 Nov 2026): once a week, one pull request bundling every minor and patch update, and one per major version. CI tests each before it is merged.
# The .NET packages' major versions (Microsoft.*, System.*) wait until Muteb decides to move to the next .NET.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
