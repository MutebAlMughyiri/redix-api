# sqlc: each domain keeps its queries in its own folder; all are generated into one package, internal/db/store, so every domain shares one type per
# table (redix-api #140, R9, R16). Every domain shares one schema and one set of types:
# a GUID is uuid.UUID, a moment moment.Moment, a date moment.Date, a yes/no bool, four decimals fixed.Number (G9, G10, N6).
version: "2"
overrides:
  go:
    overrides:
      - column: "history.id"
        go_type: "int64"
      - column: "entry_decisions.id"
        go_type: "int64"
      - column: "lk_*.id"
        go_type: "int64"
      - column: "*.id"
        go_type: "github.com/google/uuid.UUID"
      - column: "*.*_id"
        go_type: "github.com/google/uuid.UUID"
      - column: "*.*_at"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/moment.Moment"
      - column: "*.at"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/moment.Moment"
      - column: "users.locked_until"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/moment.Moment"
      - column: "*.*_date"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/moment.Date"
      - column: "transfers.date"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/moment.Date"
      - column: "*.is_*"
        go_type: "bool"
      - column: "user_projects.permissions"
        go_type: "string"
      - column: "user_projects.role_name"
        go_type: "string"
      - column: "user_projects.partner_ids"
        go_type: "string"
      - column: "users.must_change_password"
        go_type: "bool"
      - column: "*.show_in_reports"
        go_type: "bool"
      - column: "devices.uses_biometrics"
        go_type: "bool"
      - column: "items.shows_table_percentages"
        go_type: "bool"
      - column: "*.amount"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/fixed.Number"
      - column: "contracts.quantity"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/fixed.Number"
      - column: "contracts.unit_price"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/fixed.Number"
      - column: "contracts.value"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/fixed.Number"
      - column: "periodic_reports.expenses_total"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/fixed.Number"
      - column: "reconciliation_balances.actual_balance"
        go_type: "github.com/MutebAlMughyiri/redix-api/go-backend/internal/platform/fixed.Number"
sql:
  - engine: sqlite
    schema: internal/db/migrations
    queries:
      - internal/translations/queries.sql
      - internal/projectfile/queries.sql
      - internal/config/queries.sql
      - internal/auth/queries.sql
      - internal/access/queries.sql
      - internal/history/queries.sql
      - internal/email/queries.sql
      - internal/users/queries.sql
      - internal/projects/queries.sql
      - internal/structure/queries.sql
      - internal/settings/queries.sql
      - internal/suppliers/queries.sql
      - internal/accounts/queries.sql
      - internal/contracts/queries.sql
      - internal/entries/queries.sql
      - internal/partners/queries.sql
      - internal/attachments/queries.sql
      - internal/documents/queries.sql
      - internal/reports/queries.sql
      - internal/notifications/queries.sql
    gen:
      go:
        package: store
        out: internal/db/store
        omit_unused_structs: true
        emit_prepared_queries: true
