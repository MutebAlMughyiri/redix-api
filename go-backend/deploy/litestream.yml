# Continuous backup of the SQLite file to an S3-compatible bucket (redix-api #140 D5, #145), in Litestream 0.5's form: one replica, and
# snapshots kept 30 days. The bucket, its endpoint and its keys come from /etc/redix/backup.env, which Litestream's service loads.
snapshot:
  interval: 24h
  retention: 720h

retention:
  enabled: true

dbs:
  - path: /var/lib/redix/redix.db
    replica:
      type: s3
      bucket: ${REDIX_BACKUP_BUCKET}
      path: redix.db
      endpoint: ${REDIX_BACKUP_ENDPOINT}
      region: auto
      access-key-id: ${AWS_ACCESS_KEY_ID}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY}
      sync-interval: 1s
